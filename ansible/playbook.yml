---
- name: Prepare OS and Prerequisites for K3s
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Enable IPv4 forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: true

    - name: Install required system packages
      apt:
        name:
          - curl
          - open-iscsi
          - nfs-common
        state: present
        update_cache: true

- name: Install K3s Control Plane
  hosts: control_plane
  become: true
  tasks:
    - name: Install K3s server
      shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
          --tls-san 192.168.0.110 \
          --write-kubeconfig-mode "0644"
      args:
        creates: /usr/local/bin/k3s

    - name: Get K3s Node Token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_b64

    - name: Set K3s token fact
      set_fact:
        k3s_token: "{{ k3s_token_b64.content | b64decode | trim }}"

    - name: Ensure local ~/.kube directory exists
      delegate_to: localhost
      become: false
      file:
        path: "~/.kube"
        state: directory
        mode: "0755"

    - name: Fetch kubeconfig to local machine
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/.kube/config
        flat: true

- name: Configure local kubeconfig
  hosts: localhost
  connection: local
  tasks:
    - name: Update server address in local kubeconfig
      replace:
        path: ~/.kube/config
        regexp: '127\.0\.0\.1'
        replace: '192.168.0.110'

- name: Join K3s Worker Node
  hosts: workers
  become: true
  tasks:
    - name: Install K3s worker and join cluster
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL="https://192.168.0.110:6443" K3S_TOKEN="{{ hostvars[groups['control_plane'][0]]['k3s_token'] }}" sh -
      args:
        creates: /usr/local/bin/k3s-agent