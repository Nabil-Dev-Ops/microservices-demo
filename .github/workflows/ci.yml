name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-manifests:
    name: Lint Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate YAML Syntax
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" kubernetes-manifests/

      - name: Kubeconform Manifest Check
        uses: yannh/kubeconform-action@v0.8.0
        with:
          files: 'kubernetes-manifests/*.yaml'

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint-manifests
    strategy:
      matrix:
        service:
          - frontend
          - cartservice
          - productcatalogservice
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Microservice
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:test